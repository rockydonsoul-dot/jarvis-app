name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          cat > settings.gradle <<'JARVIS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisApp"
          include ':app'
          JARVIS_EOF
          cat > build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          JARVIS_EOF
          cat > gradle.properties <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          JARVIS_EOF
          mkdir -p app
          cat > app/build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.jarvis.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.jarvis.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="Jarvis"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'JARVIS_EOF'
          package com.jarvis.app

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class HeartView(context: Context) : View(context) {
              var active = false
              var speaking = false
              private val heart = Path()
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  heart.moveTo(0f, 28f)
                  heart.cubicTo(-40f, 2f, -30f, -30f, -12f, -30f)
                  heart.cubicTo(-4f, -30f, 0f, -24f, 0f, -20f)
                  heart.cubicTo(0f, -24f, 4f, -30f, 12f, -30f)
                  heart.cubicTo(30f, -30f, 40f, 2f, 0f, 28f)
                  heart.close()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f
                  val u = minOf(w, h) / 2f * 0.96f / 104f
                  val t = SystemClock.uptimeMillis()

                  p.style = Paint.Style.STROKE
                  p.pathEffect = null
                  p.color = Color.parseColor("#4A1D35")
                  p.strokeWidth = 1.5f * u
                  c.drawCircle(cx, cy, 104f * u, p)

                  c.save()
                  c.rotate((t / 60f) % 360f, cx, cy)
                  p.color = Color.parseColor("#8A3A5E")
                  p.strokeWidth = 8f * u
                  p.pathEffect = DashPathEffect(floatArrayOf(3f * u, 9f * u), 0f)
                  c.drawCircle(cx, cy, 96f * u, p)
                  c.restore()

                  c.save()
                  c.rotate(-((t / 35f) % 360f), cx, cy)
                  p.color = Color.parseColor("#E8588A")
                  p.strokeWidth = 3f * u
                  p.pathEffect = DashPathEffect(floatArrayOf(130f * u, 43f * u), 0f)
                  c.drawCircle(cx, cy, 80f * u, p)
                  c.restore()

                  p.pathEffect = null
                  p.style = Paint.Style.FILL
                  p.color = Color.parseColor("#2A1220")
                  c.drawCircle(cx, cy, 62f * u, p)
                  p.style = Paint.Style.STROKE
                  p.color = Color.parseColor("#F4A6C0")
                  p.strokeWidth = 3f * u
                  c.drawCircle(cx, cy, 62f * u, p)

                  val period = if (speaking) 140.0 else 420.0
                  val beat = ((Math.sin(t / period) + 1.0) / 2.0).toFloat()
                  val amp = if (speaking) 0.14f else if (active) 0.07f else 0.02f
                  val k = u * 1.05f * (1f + amp * beat)
                  c.save()
                  c.translate(cx, cy - u)
                  c.scale(k, k)
                  p.style = Paint.Style.FILL
                  p.color = Color.parseColor("#E8588A")
                  c.drawPath(heart, p)
                  p.style = Paint.Style.STROKE
                  p.color = Color.parseColor("#FBD3E1")
                  p.strokeWidth = 2f
                  c.drawPath(heart, p)
                  c.restore()

                  p.style = Paint.Style.FILL
                  smallHeart(c, p, cx - 104f * u, cy - 85f * u, u * 0.3f, "#A8446E")
                  smallHeart(c, p, cx + 104f * u, cy - 67f * u, u * 0.22f, "#F4A6C0")
                  smallHeart(c, p, cx - 86f * u, cy + 97f * u, u * 0.24f, "#F4A6C0")
                  smallHeart(c, p, cx + 92f * u, cy + 87f * u, u * 0.3f, "#A8446E")

                  postInvalidateOnAnimation()
              }

              private fun smallHeart(c: Canvas, paint: Paint, x: Float, y: Float, s: Float, color: String) {
                  c.save()
                  c.translate(x, y)
                  c.scale(s, s)
                  paint.color = Color.parseColor(color)
                  c.drawPath(heart, paint)
                  c.restore()
              }
          }

          class MainActivity : Activity() {

              private lateinit var statusView: TextView
              private lateinit var transcript: TextView
              private lateinit var button: Button
              private lateinit var heartView: HeartView
              private val matchParent = LinearLayout.LayoutParams.MATCH_PARENT
              private val wrapContent = LinearLayout.LayoutParams.WRAP_CONTENT

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun box(fill: String, stroke: String, strokeDp: Int, radiusDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(Color.parseColor(fill))
                  g.setStroke(dp(strokeDp), Color.parseColor(stroke))
                  g.cornerRadius = dp(radiusDp).toFloat()
                  return g
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#1A0A14")
                  window.navigationBarColor = Color.parseColor("#1A0A14")

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setBackgroundColor(Color.parseColor("#1A0A14"))
                  root.setPadding(dp(20), dp(36), dp(20), dp(24))

                  val title = TextView(this)
                  title.text = "Jarvis"
                  title.textSize = 24f
                  title.letterSpacing = 0.2f
                  title.setTextColor(Color.parseColor("#F4A6C0"))
                  title.gravity = Gravity.CENTER
                  root.addView(title)

                  statusView = TextView(this)
                  statusView.textSize = 13f
                  statusView.setTextColor(Color.parseColor("#A8708A"))
                  statusView.gravity = Gravity.CENTER
                  root.addView(statusView)

                  heartView = HeartView(this)
                  heartView.setOnClickListener { toggle() }
                  root.addView(heartView, LinearLayout.LayoutParams(matchParent, 0, 1f))

                  transcript = TextView(this)
                  transcript.textSize = 15f
                  transcript.setTextColor(Color.parseColor("#FBD3E1"))
                  transcript.setPadding(dp(16), dp(14), dp(16), dp(14))
                  transcript.minHeight = dp(120)
                  transcript.background = box("#2A1220", "#6B2A47", 1, 14)
                  root.addView(transcript, LinearLayout.LayoutParams(matchParent, wrapContent))

                  button = Button(this)
                  button.isAllCaps = false
                  button.textSize = 16f
                  button.setTextColor(Color.parseColor("#F4A6C0"))
                  button.background = box("#2A1220", "#E8588A", 2, 28)
                  button.setOnClickListener { toggle() }
                  val bp = LinearLayout.LayoutParams(matchParent, dp(56))
                  bp.topMargin = dp(16)
                  root.addView(button, bp)

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  JarvisBus.onChange = { refresh() }
                  refresh()
              }

              override fun onPause() {
                  JarvisBus.onChange = null
                  super.onPause()
              }

              private fun refresh() {
                  statusView.text = JarvisBus.status
                  heartView.active = JarvisBus.running
                  heartView.speaking = JarvisBus.speaking
                  val you = if (JarvisBus.you.isEmpty()) "..." else JarvisBus.you
                  val reply = if (JarvisBus.jarvis.isEmpty()) "..." else JarvisBus.jarvis
                  transcript.text = "You\n" + you + "\n\nJarvis\n" + reply
                  button.text = if (JarvisBus.running) "Stop Jarvis" else "Start Jarvis"
              }

              private fun toggle() {
                  if (JarvisBus.running) {
                      stopService(Intent(this, JarvisService::class.java))
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                      if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      requestPermissions(perms.toTypedArray(), 1)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow display over other apps, then come back and tap again", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      return
                  }
                  startForegroundService(Intent(this, JarvisService::class.java))
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      toggle()
                  }
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/JarvisService.kt <<'JARVIS_EOF'
          package com.jarvis.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class JarvisService : Service() {

              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private val handler = Handler(Looper.getMainLooper())
              private var awake = false
              private var speaking = false
              private var running = true
              private val wakeWords = listOf("jarvis", "jarvish", "jervis", "jarves")

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("jarvis", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "jarvis")
                      .setContentTitle("Jarvis is listening")
                      .setContentText("Say: Jarvis, open YouTube")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  JarvisBus.running = true
                  JarvisBus.status = "Starting..."
                  JarvisBus.changed()

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale.US)
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(id: String?) {}
                              override fun onDone(id: String?) { resume() }
                              override fun onError(id: String?) { resume() }
                          })
                          speak("Jarvis online")
                      } else {
                          handler.post { startListening() }
                      }
                  }
              }

              private fun resume() {
                  handler.post {
                      speaking = false
                      startListening()
                  }
              }

              private fun speak(text: String) {
                  speaking = true
                  JarvisBus.speaking = true
                  JarvisBus.jarvis = text
                  JarvisBus.status = "Speaking..."
                  JarvisBus.changed()
                  recognizer?.cancel()
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis")
              }

              private fun startListening() {
                  if (!running || speaking) return
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      stopSelf()
                      return
                  }
                  if (recognizer == null) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      recognizer?.setRecognitionListener(object : RecognitionListener {
                          override fun onResults(results: Bundle?) {
                              val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              val text = (list?.firstOrNull() ?: "").lowercase()
                              handleSpeech(text)
                          }
                          override fun onError(error: Int) {
                              handler.postDelayed({ startListening() }, 700)
                          }
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                  recognizer?.startListening(i)
                  JarvisBus.speaking = false
                  JarvisBus.status = if (awake) "I am listening. Say your command." else "Listening for Jarvis"
                  JarvisBus.changed()
              }

              private fun handleSpeech(text: String) {
                  if (text.isBlank()) {
                      startListening()
                      return
                  }
                  val wake = wakeWords.firstOrNull { text.contains(it) }
                  var cmd = text
                  if (wake != null) {
                      cmd = text.substringAfter(wake).trim()
                      if (cmd.isEmpty()) {
                          awake = true
                          speak("Yes?")
                          return
                      }
                  } else if (!awake) {
                      startListening()
                      return
                  }
                  awake = false
                  JarvisBus.you = text
                  runCommand(cmd)
              }

              private fun runCommand(c: String) {
                  try {
                      when {
                          c.startsWith("open ") -> openApp(c.removePrefix("open ").trim())
                          c.startsWith("call ") -> {
                              val number = c.removePrefix("call ").filter { it.isDigit() || it == '+' }
                              if (number.length >= 3) {
                                  launch(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + number)))
                                  speak("Dialing")
                              } else {
                                  speak("Please say a phone number")
                              }
                          }
                          c.startsWith("search ") -> {
                              val q = c.removePrefix("search ").removePrefix("for ")
                              launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q))))
                              speak("Searching")
                          }
                          c.contains("flashlight") || c.contains("torch") -> {
                              torch(!c.contains("off"))
                              speak("Okay")
                          }
                          c.contains("volume up") -> volume(AudioManager.ADJUST_RAISE)
                          c.contains("volume down") -> volume(AudioManager.ADJUST_LOWER)
                          c.contains("time") -> speak("It is " + SimpleDateFormat("h:mm a", Locale.getDefault()).format(Date()))
                          else -> speak("Sorry, I do not know that yet")
                      }
                  } catch (e: Exception) {
                      speak("Something went wrong")
                  }
              }

              private fun openApp(name: String) {
                  val pm = packageManager
                  val main = Intent(Intent.ACTION_MAIN)
                  main.addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(main, 0)
                  val match = apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(name) }
                  if (match == null) {
                      speak("I cannot find " + name)
                      return
                  }
                  val intent = pm.getLaunchIntentForPackage(match.activityInfo.packageName)
                  if (intent == null) {
                      speak("I cannot open " + name)
                      return
                  }
                  launch(intent)
                  speak("Opening " + name)
              }

              private fun torch(on: Boolean) {
                  val cm = getSystemService(CameraManager::class.java)
                  val id = cm.cameraIdList.firstOrNull {
                      cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return
                  cm.setTorchMode(id, on)
              }

              private fun volume(direction: Int) {
                  val am = getSystemService(AudioManager::class.java)
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, AudioManager.FLAG_SHOW_UI)
                  speak("Okay")
              }

              private fun launch(i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(i)
              }

              override fun onDestroy() {
                  running = false
                  JarvisBus.running = false
                  JarvisBus.speaking = false
                  JarvisBus.status = "Stopped. Tap the heart to start"
                  JarvisBus.changed()
                  recognizer?.destroy()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/JarvisBus.kt <<'JARVIS_EOF'
          package com.jarvis.app

          object JarvisBus {
              var running = false
              var speaking = false
              var status = "Tap the heart to start"
              var you = ""
              var jarvis = ""
              var onChange: (() -> Unit)? = null

              fun changed() {
                  onChange?.invoke()
              }
          }
          JARVIS_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
